q05:  # u02 (NA compressor technician with high-voltage certification): "TAC-C-0143 tripped on E-31. How do I reset it?"
  outcome: answer
  required:
    # The paraphrase is accepted for q05 only (orchestrator DECISION 2026-10-14 18:40).
    - fact: E-31 is a VFD overcurrent trip
      all: [E-31, "overcurrent | output current above its peak current limit"]
    - fact: it can't be reset from the panel
      all: [panel]
    - fact: follow HV-PROC-07
      all: [HV-PROC-07]
    - fact: notify the site
      all: [site, "notify | inform | tell | let"]
    - fact: isolate and lock out per HV-PROC-02
      all: [HV-PROC-02, "LOTO | lock out | lockout | lock-out"]
    - fact: wait at least 5 minutes
      all: ["5 minutes | 5 min"]
    - fact: verify below 50 V DC at TP1 and TP2
      all: ["50 V DC", TP1, TP2]
    - fact: inspect the drive for damage
      all: [damage, "inspect | check | find"]
    - fact: motor insulation above 100 MOhm at 1,000 V
      all: ["100 MOhm", "1,000 V"]
    - fact: hold RESET on the drive keypad for 3 s
      all: [RESET, "3 s | 3 seconds"]
    - fact: P9.01 = 1
      all: [P9.01]
    - fact: run unloaded for 10 minutes
      all: ["10 minutes | 10 min", unloaded]
    - fact: with current below 210 A
      all: ["210 A"]
    - fact: "branch: if E-31 returns within 24 hours, escalate to Vastra L2 and open a High case"
      all: ["24 hours | 24 h", Vastra L2, "High case | High-priority case | High priority"]

