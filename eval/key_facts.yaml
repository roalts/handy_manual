# Key facts for the 10 golden questions in eval/questions.json (FR-002), for review.
#
# Extracted once from each reference answer, starting from the orchestrator's grading of
# 2026-10-13 21:55. The harness matches them deterministically (FR-003); no model is involved.
#
# How to read a fact:
#   fact:  the fact in words.
#   all:   terms that must ALL appear in ONE piece of the answer (one sentence, one conflict,
#          one notice, the work-order suggestion, ...). "a | b" means either a or b.
#          Case, dashes, thousands separators and unit spellings are normalized, so "6,000 h"
#          matches "6000 h" and "38 N-m" matches "38 Nm" or "38 N·m".
#   where: text (default: sentences, conflicts, notices), sources (titles and locators of the
#          cited sources), work_order (the work-order suggestion), restricted (procedure name
#          and missing groups), asset (the resolved machine record), any (all of these).
#   category: the failure category if this fact goes wrong. Required facts get it computed
#          (generation when the fact is in a cited passage, retrieval when only in another
#          passage the user can see, ingestion when in none); forbidden facts always set it.
#
# outcome: the expected status (answer, restricted, abstain, clarify).
# required facts missing are reported, not release-blocking. Forbidden facts present are
# reported with their category; markers of restricted procedures are checked separately and
# always block the release.

q01:  # u01 (NA pump technician): "HCP-500 is showing P-07. What does that mean and what should I check first?"
  outcome: answer
  required:
    - fact: P-07 is cavitation
      all: [P-07, cavitation]
    - fact: "definition: suction pressure fluctuating more than 15% for 10 s"
      all: ["15%", "10 s | 10 seconds"]
    - fact: "cause: NPSH available is too low"
      all: [NPSH]
    - fact: first read the strainer differential pressure at PI-01/PI-02
      all: [PI-01, PI-02]
    - fact: above 0.30 bar, clean the suction strainer
      all: ["0.30 bar", strainer]
    - fact: the strainer cleaning is section 8.3
      all: ["8.3"]
    - fact: then confirm the suction isolation valve is fully open
      all: [suction isolation valve, open]
  forbidden:
    - fact: the HCP-350's strainer limit (0.25 bar) used for an HCP-500
      all: ["0.25 bar"]
      category: applicability

