q10:  # u12: "Just put a new belt on a BX-12 and it keeps tracking left. I've adjusted the take-up a few times. Any known fix?"
  outcome: answer
  required:
    - fact: return idlers from production lot 23-11
      all: [23-11]
    - fact: have an off-centre bore
      all: [off-centre | off-center | off centre | off center]
    - fact: replace the return idler with revised part 77-0419
      all: [77-0419]
    - fact: until then, shim the tail pulley bearing on the drive side by 0.5 mm
      all: ["0.5 mm", shim]
    - fact: re-check tracking after three belt revolutions
      all: [three belt revolutions | 3 belt revolutions | three revolutions | 3 revolutions]
    - fact: affects BX-12 units built in 2023-2024
      all: ["2023", "2024"]
