[project]
name = "copilot-ingest"
version = "0.1.0"
description = "Corpus ingestion pipeline for the Corvane field service copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "pikepdf>=9",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pandas>=2.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.60",
    "lingua-language-detector>=2.0",
    "tiktoken>=0.8",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
copilot-ingest = "copilot_ingest.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_ingest", "src/copilot_contracts", "src/copilot_answer", "src/copilot_api",
            "src/copilot_workorders", "src/copilot_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against the real corpus",
    "acceptance: checks spec acceptance facts against a built dataset",
    "acl: access-control visibility grid",
    "hosted: calls the hosted model provider",
]
